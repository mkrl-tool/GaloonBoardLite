<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行動予定表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="whiteboard-frame">
    <!-- 上部コントロール（控えめに配置） -->
    <header class="board-top-controls">
      <div class="date-stepper">
        <button id="btn-prev" title="前日">◀</button>
        <button id="btn-today" title="今日に戻る">今日</button>
        <button id="btn-next" title="翌日">▶</button>
      </div>
      <div class="app-actions">
        <button id="btn-pin" class="icon-btn" title="最前面ピン留め">📌</button>
        <button id="btn-refresh" class="icon-btn" title="最新に更新">🔄</button>
        <button id="btn-settings" class="icon-btn" title="設定">⚙</button>
      </div>
    </header>

    <!-- ホワイトボード メインタイトル -->
    <h1 class="board-title">行 動 予 定 表</h1>

    <!-- 日付記入欄 -->
    <div class="board-date-section">
      <div class="date-display">
        <span id="date-label">10月 27日 (火)</span>
      </div>
    </div>

    <!-- 表ヘッダー -->
    <div class="board-table-header">
      <div class="col-name">氏名</div>
      <div class="col-dest">行先</div>
      <div class="col-time">帰社時間</div>
    </div>

    <div class="board-header-line"></div>

    <!-- 行リスト -->
    <div class="board-rows-container" id="board-rows">
      <!-- JavaScriptで動的生成 -->
    </div>

    <!-- フッター＆マーカーポケット -->
    <footer class="board-footer">
      <div class="footer-status" id="footer-status">更新: --:--</div>
      
      <!-- 右下のマーカー＆イレーザー入れアクセント -->
      <div class="marker-pocket" title="マーカーポケット">
        <div class="marker marker-black"></div>
        <div class="marker marker-red"></div>
        <div class="eraser">
          <div class="eraser-handle"></div>
          <div class="eraser-felt"></div>
        </div>
        <div class="pocket-glass"></div>
      </div>
    </footer>
  </div>

  <!-- 予定詳細モーダル -->
  <div id="event-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span class="badge" id="modal-menu-badge">外出</span>
        <button class="modal-close-btn" id="modal-close-btn">×</button>
      </div>
      <h3 id="modal-title">予定の件名</h3>
      <div class="modal-detail-row">🕒 <span id="modal-time">10:00 - 12:30</span></div>
      <div class="modal-detail-row">👥 <span id="modal-attendees">山田 太郎, 佐藤 美咲</span></div>
      <div class="modal-notes-area">
        <label>メモ / 場所:</label>
        <div id="modal-notes" class="modal-notes-content">メモ内容</div>
      </div>
      <button class="btn-primary" id="modal-ok-btn">閉じる</button>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-box settings-modal-box">
      <div class="modal-header">
        <h3>⚙ ガルーン連携・動作設定</h3>
        <button class="modal-close-btn" id="settings-close-btn">×</button>
      </div>
      
      <div class="settings-body">
        <label class="checkbox-row highlight">
          <input type="checkbox" id="cfg-mock-mode">
          <span>デモ（モック）モードを使用する（ガルーン未接続でも動作確認可能）</span>
        </label>

        <div class="form-group">
          <label>ガルーン URL:</label>
          <input type="text" id="cfg-url" placeholder="http://192.168.1.100/cgi-bin/cbgrn/grn.cgi">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label>ログイン名:</label>
            <input type="text" id="cfg-username" placeholder="ガルーンのログイン名">
          </div>
          <div class="form-group flex-1">
            <label>パスワード:</label>
            <input type="password" id="cfg-password" placeholder="パスワード">
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="cfg-verify-ssl" checked>
          <span>SSL証明書を検証する（社内オレオレ証明書の場合は外す）</span>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="cfg-use-basic">
          <span>WebサーバーのBasic認証を使用する</span>
        </label>

        <div id="basic-auth-group" class="form-row hidden">
          <div class="form-group flex-1">
            <label>Basic ユーザー:</label>
            <input type="text" id="cfg-basic-user">
          </div>
          <div class="form-group flex-1">
            <label>Basic パスワード:</label>
            <input type="password" id="cfg-basic-pass">
          </div>
        </div>

        <div class="test-row">
          <button id="btn-test-conn" class="btn-secondary">🔌 接続テスト</button>
          <span id="test-result-msg"></span>
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label>自動更新間隔:</label>
          <select id="cfg-interval">
            <option value="1">1分ごと</option>
            <option value="3" selected>3分ごと（推奨）</option>
            <option value="5">5分ごと</option>
            <option value="10">10分ごと</option>
            <option value="0">手動更新のみ</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button id="settings-cancel-btn" class="btn-secondary">キャンセル</button>
        <button id="settings-save-btn" class="btn-primary">保存して適用</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
